name: CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'pipelines/mapainversiones-cali/**'
      - '.github/workflows/ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'pipelines/mapainversiones-cali/**'
      - '.github/workflows/ci-cd.yml'
permissions:
  contents: read
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: mapainversiones-cali
  APP_DIR: pipelines/mapainversiones-cali

jobs:
  test:
    name: Lint + tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipelines/mapainversiones-cali
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/mapainversiones-cali/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.4.2 ruff==0.17.3 pip-audit==2.10.1
      - name: Lint (ruff)
        # Solo errores graves (sintaxis, nombres indefinidos).
        run: ruff check --select E9,F63,F7,F82 .
      - name: Test
        run: |
          python -m pytest tests/unit
          mapainversiones-cali --list-runs
      - name: Audit dependencies (pip-audit)
        # No bloqueante: hay CVEs conocidos en python-dotenv y requests. Quitar continue-on-error al actualizarlas.
        continue-on-error: true
        run: pip-audit -r requirements.lock --no-deps --disable-pip

  build-and-deploy:
    name: Build, publish and deploy
    needs: test
    # Construir, publicar y desplegar solo después de un push a main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-mapainversiones-cali
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
      - name: Install Trivy (verified)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
      - name: Fecha para la caché de Trivy
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Caché de la base de datos de Trivy
        # Evita bajar la DB en cada run y los errores TOOMANYREQUESTS de ghcr.io.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-
      - name: Scan container image (Trivy)
        # Falla ante HIGH o CRITICAL que ya tengan corrección disponible.
        run: '"$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress ${{ env.IMAGE_NAME }}:${{ github.sha }}'

      - name: Conectarse a AWS mediante OIDC
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Login a ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Publicar imagen en ECR (tag = SHA del commit)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"

      - name: Descargar la task definition actual
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json
      - name: Poner la nueva imagen en la task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
      - name: Registrar nueva revisión en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}

  agente-cognitivo-ingestion:
    # Deshabilitado por ahora. Para reactivarlo, elimina la siguiente línea.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipelines/agente-cognitivo-ingestion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.4.2
      - name: Test
        run: python -m pytest tests/unit
      - name: Build container
        run: docker build -t agente-cognitivo-ingestion:ci .

