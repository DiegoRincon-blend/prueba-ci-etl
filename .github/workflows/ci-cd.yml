name: diagnostico

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ver-claims:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Mostrar sub del token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import base64,json,sys; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print('sub =', d.get('sub')); print('aud =', d.get('aud'))" "$TOKEN"