name: Secret scan
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: Gitleaks (files and history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan checkout
        run: '"$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner --no-color "$GITHUB_WORKSPACE"'
      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --no-color "$GITHUB_WORKSPACE"'
