name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mapainversiones-cali:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/mapainversiones-cali
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.4.2
      - name: Test
        run: |
          python -m pytest tests/unit
          mapainversiones-cali --list-runs
      - name: Build container
        run: docker build -t mapainversiones-cali:ci .
  agente-cognitivo-ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/agente-cognitivo-ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.4.2
      - name: Test
        run: python -m pytest tests/unit
      - name: Build container
        run: docker build -t agente-cognitivo-ingestion:ci .
