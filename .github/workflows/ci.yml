name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mapainversiones-cali:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipelines/mapainversiones-cali
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/mapainversiones-cali/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.4.2 ruff==0.17.3 pip-audit==2.10.1
      - name: Lint (ruff)
        # Solo errores graves (sintaxis, nombres indefinidos). Ampliar las reglas cuando se limpie el código.
        run: ruff check --select E9,F63,F7,F82 .
      - name: Audit dependencies (pip-audit)
        # No bloqueante: hay CVEs conocidos en python-dotenv y requests. Quitar continue-on-error al actualizarlas.
        continue-on-error: true
        run: pip-audit -r requirements.lock --no-deps --disable-pip
      - name: Test
        run: |
          python -m pytest tests/unit
          mapainversiones-cali --list-runs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pipelines/mapainversiones-cali
          push: false
          load: true
          tags: mapainversiones-cali:ci
          cache-from: type=gha,scope=mapainversiones-cali
          cache-to: type=gha,mode=max,scope=mapainversiones-cali
      - name: Install Trivy (verified)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
      - name: Scan container image (Trivy)
        # Falla ante vulnerabilidades HIGH o CRITICAL que ya tengan corrección disponible.
        run: '"$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress mapainversiones-cali:ci'
  agente-cognitivo-ingestion:
    # Deshabilitado por ahora. Para reactivarlo, elimina la siguiente línea.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipelines/agente-cognitivo-ingestion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.4.2
      - name: Test
        run: python -m pytest tests/unit
      - name: Build container
        run: docker build -t agente-cognitivo-ingestion:ci .
