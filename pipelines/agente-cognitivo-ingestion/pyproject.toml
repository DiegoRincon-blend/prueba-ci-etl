[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-cognitivo-ingestion"
version = "0.1.0"
description = "Base del pipeline de ingestión para el agente cognitivo"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
agente-cognitivo-ingestion = "agente_cognitivo_ingestion.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
